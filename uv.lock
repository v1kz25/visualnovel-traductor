    { name = "keyring" },
    { name = "mss" },
    { name = "numpy" },
    { name = "onnxruntime" },
    { name = "opencc" },
    { name = "opencv-python-headless" },
    { name = "pillow" },
    { name = "piper-tts" },
    { name = "pulsectl", marker = "sys_platform == 'linux'" },
    { name = "pycaw", marker = "sys_platform == 'win32'" },
    { name = "pyside6-essentials" },
    { name = "python-xlib", marker = "sys_platform == 'linux'" },
    { name = "rapidocr" },
    { name = "sounddevice", marker = "sys_platform == 'win32'" },
    { name = "soundfile" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "pytest-qt" },
    { name = "ruff" },
    { name = "types-python-xlib", marker = "sys_platform == 'linux'" },
]

[package.metadata]
requires-dist = [
    { name = "keyring", specifier = ">=25.7.0" },
    { name = "mss", specifier = ">=10.2.0" },
    { name = "numpy", specifier = ">=2.5.3" },
    { name = "onnxruntime", specifier = ">=1.30.0" },
    { name = "opencc", specifier = ">=1.4.2" },
    { name = "opencv-python-headless", specifier = ">=5.0.0.93" },
    { name = "pillow", specifier = ">=12.3.0" },
    { name = "piper-tts", specifier = ">=1.8.0" },
    { name = "pulsectl", marker = "sys_platform == 'linux'", specifier = ">=24.12.0" },
    { name = "pycaw", marker = "sys_platform == 'win32'", specifier = ">=20240316" },
    { name = "pyside6-essentials", specifier = ">=6.11.2" },
    { name = "python-xlib", marker = "sys_platform == 'linux'", specifier = ">=0.33" },
    { name = "rapidocr", specifier = ">=3.9.2" },
    { name = "sounddevice", marker = "sys_platform == 'win32'", specifier = ">=0.5" },
    { name = "soundfile", specifier = ">=0.14.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = ">=2.3.1" },
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-cov", specifier = ">=7.1.0" },
    { name = "pytest-qt", specifier = ">=4.5.0" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "types-python-xlib", marker = "sys_platform == 'linux'", specifier = ">=0.33.0.20260724" },
]
